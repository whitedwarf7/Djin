<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Djin</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <h1>Djin</h1>
    <div id="status" class="status">connecting…</div>
  </header>

  <main>
    <section id="chat" class="chat" aria-live="polite"></section>

    <section id="approvals" class="approvals hidden">
      <h2>Approval required</h2>
      <div id="approval-list"></div>
    </section>

    <div id="voice-bar" class="voice-bar hidden">
      <button type="button" id="mic" class="mic" aria-pressed="false" title="Talk (Ctrl+Space)">Talk</button>
      <label class="toggle"><input type="checkbox" id="hands-free" /> Hands-free</label>
      <label class="toggle"><input type="checkbox" id="speak-replies" checked /> Speak replies</label>
      <span id="voice-status" class="voice-status" aria-live="polite"></span>
    </div>

    <form id="composer" class="composer">
      <textarea id="input" rows="3" placeholder="Ask Djin… (Enter to send, Shift+Enter for a new line)"></textarea>
      <button type="submit" id="send">Send</button>
    </form>
  </main>

  <script src="/static/markdown.js"></script>
  <script src="/static/voice.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
