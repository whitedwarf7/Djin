name: Djin
options:
  bundleIdPrefix: com.whitedwarf7
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: 1
targets:
  Djin:
    type: application
    platform: iOS
    sources:
      - path: Djin
        excludes:
          - Resources
    resources:
      - path: Djin/Resources/Assets.xcassets
    info:
      path: Djin/Resources/Info.plist
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.whitedwarf7.djin
        PRODUCT_NAME: Djin
  DjinTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DjinTests
    dependencies:
      - target: Djin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whitedwarf7.djin.tests
schemes:
  Djin:
    build:
      targets:
        Djin: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - DjinTests
    archive:
      config: Release
